<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Meal Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f9f7f4 0%, #f5f2ed 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #1a2633 0%, #2d3e4f 100%);
            padding: 1.5rem 1.25rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #f9f7f4;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            color: #a8b5c4;
            font-weight: 400;
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            gap: 24px;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid rgba(122, 155, 127, 0.15);
            background: rgba(255,255,255,0.4);
            overflow-x: auto;
        }

        .tabs button {
            padding: 8px 0;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: #8a9aaa;
            cursor: pointer;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: -0.3px;
            white-space: nowrap;
        }

        .tabs button.active {
            border-bottom-color: #7a9b7f;
            color: #1a2633;
            font-weight: 500;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1.25rem;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Recipes Tab */
        .filter-row {
            display: flex;
            gap: 12px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group label {
            font-size: 11px;
            font-weight: 600;
            color: #8a9aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #e0dcd7;
            font-size: 13px;
            background: white;
            color: #1a2633;
            min-width: 140px;
        }

        .protein-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .protein-btn {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            border: 2px solid #e0dcd7;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
            color: #1a2633;
            font-size: 22px;
        }

        .protein-btn:hover {
            border-color: #7a9b7f;
            background: #f5f2ed;
        }

        .protein-btn.active {
            background: #7a9b7f;
            border-color: #7a9b7f;
            color: white;
        }

        .protein-btn svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .search-box label {
            font-size: 11px;
            font-weight: 600;
            color: #8a9aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-box input {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #e0dcd7;
            font-size: 13px;
            background: white;
        }

        .recipes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #recipesList {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (max-width: 768px) {
            #recipesList {
                grid-template-columns: 1fr;
            }
        }

        .recipe-item {
            background: white;
            border-radius: 8px;
            padding: 14px;
            border: 1px solid #e0dcd7;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .recipe-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .recipe-item-title {
            flex: 1;
        }

        .recipe-item h4 {
            font-size: 15px;
            font-weight: 600;
            color: #1a2633;
            margin: 0 0 6px 0;
            line-height: 1.3;
        }

        .recipe-protein-icon {
            font-size: 24px;
            line-height: 1;
        }

        .recipe-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            background: #f5f2ed;
            color: #8a9aaa;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .recipe-item input[type="checkbox"] {
            cursor: pointer;
            accent-color: #7a9b7f;
            width: 18px;
            height: 18px;
        }

        /* Shortlist Tab */
        .shortlist-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .shortlist-item {
            background: white;
            border-radius: 8px;
            padding: 14px;
            border: 1px solid #e0dcd7;
        }

        .shortlist-item h4 {
            font-size: 14px;
            font-weight: 600;
            color: #1a2633;
            margin-bottom: 10px;
        }

        .shortlist-item select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #e0dcd7;
            font-size: 13px;
            background: white;
            color: #1a2633;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #8a9aaa;
        }

        /* This Week Tab */
        .week-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 2rem;
        }

        .day-card {
            background: white;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #e0dcd7;
            min-height: 120px;
        }

        .day-card h3 {
            font-size: 12px;
            font-weight: 600;
            color: #8a9aaa;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .day-content {
            font-size: 13px;
            color: #1a2633;
            line-height: 1.5;
        }

        .day-content.unassigned {
            color: #8a9aaa;
            font-style: italic;
        }

        .day-content .meal-name {
            font-weight: 600;
            color: #1a2633;
        }

        .day-content .cook-name {
            font-size: 12px;
            color: #7a9b7f;
            margin-top: 4px;
        }

        .shopping-section {
            background: linear-gradient(135deg, rgba(122, 155, 127, 0.08) 0%, rgba(193, 122, 74, 0.04) 100%);
            border: 1px solid #7a9b7f;
            border-radius: 8px;
            padding: 1.25rem;
            margin-top: 2rem;
        }

        .shopping-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: #1a2633;
            margin-bottom: 12px;
        }

        .shopping-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            list-style: none;
        }

        .shopping-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .shopping-list input[type="checkbox"] {
            cursor: pointer;
            accent-color: #7a9b7f;
        }

        /* Recipe Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #8a9aaa;
        }

        .modal-close:hover {
            color: #1a2633;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a2633;
            margin-bottom: 12px;
            margin-right: 32px;
        }

        .modal-meta {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .modal-badge {
            background: #f5f2ed;
            color: #8a9aaa;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 500;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h3 {
            font-size: 13px;
            font-weight: 600;
            color: #8a9aaa;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .modal-section p, .modal-section ul {
            font-size: 14px;
            color: #1a2633;
            line-height: 1.6;
            margin: 0;
        }

        .modal-section ul {
            list-style: none;
            padding: 0;
        }

        .modal-section li {
            padding: 4px 0;
        }

        .modal-section li:before {
            content: "• ";
            color: #7a9b7f;
            font-weight: 600;
            margin-right: 6px;
        }
        /* Shared shopping list */
        .shop-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .shop-header h3 { margin: 0; }
        .shop-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .shop-actions button, .shop-add button { padding: 7px 12px; border-radius: 6px; border: 1px solid #7a9b7f; background: white; color: #1a2633; font-size: 13px; cursor: pointer; }
        .shop-actions button:hover, .shop-add button:hover { background: #f5f2ed; }
        .shop-group { margin-bottom: 16px; }
        .shop-group h4 { font-size: 13px; font-weight: 600; color: #7a9b7f; margin-bottom: 6px; }
        .shop-list { list-style: none; padding: 0; }
        .shop-list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0ece7; font-size: 15px; }
        .shop-list input[type="checkbox"] { width: 22px; height: 22px; accent-color: #7a9b7f; flex-shrink: 0; }
        .shop-list li span { flex: 1; }
        .shop-list li.ticked span { text-decoration: line-through; color: #8a9aaa; }
        .shop-del { background: none; border: none; color: #c0786a; font-size: 22px; cursor: pointer; padding: 0 4px; }
        .shop-block-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #7a9b7f; margin: 12px 0 4px; }
        .shop-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #f5f2ed; color: #1a2633; border: 1px solid #e0dcd7; white-space: nowrap; }
        .shop-add { display: flex; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid #e0dcd7; }
        .shop-add input { flex: 1; padding: 10px 12px; border-radius: 6px; border: 1px solid #e0dcd7; font-size: 15px; min-width: 0; }

        @media print {
            body * { visibility: hidden; }
            #shoppingSection, #shoppingSection * { visibility: visible; }
            #shoppingSection { position: absolute; left: 0; top: 0; width: 100%; border: none; background: white; }
            .shop-actions, .shop-add, .shop-del { display: none !important; }
            .shop-list li { break-inside: avoid; }
        }
    </style>

</head>
<body>
    <div class="header">
        <h1>Weekly Meal Planner</h1>
        <p>Pick recipes, plan the week, reduce friction</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="recipes">Recipes</button>
        <button class="tab-btn" data-tab="shortlist">Shortlist</button>
        <button class="tab-btn" data-tab="week">Shopping List</button>
    </div>

    <div class="content">
        <!-- Recipes Tab -->
        <div id="recipes" class="tab-content active">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="categoryFilter">Category</label>
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Protein</label>
                    <div class="protein-filters" id="proteinFilters"></div>
                </div>

                <div class="filter-group">
                    <label for="timeFilter">Time</label>
                    <select id="timeFilter">
                        <option value="">All Times</option>
                        <option value="quick">Under 20 mins</option>
                        <option value="medium">20-30 mins</option>
                        <option value="long">30+ mins</option>
                    </select>
                </div>

                <div class="search-box">
                    <label for="searchInput">Search</label>
                    <input type="text" id="searchInput" placeholder="Recipe name...">
                </div>
            </div>

            <div class="recipes-list" id="recipesList"></div>
        </div>

        <!-- Shortlist Tab -->
        <div id="shortlist" class="tab-content">
            <div class="shortlist-container" id="shortlistContainer"></div>
        </div>

        <!-- This Week Tab -->
        <div id="week" class="tab-content">
            <div class="shopping-section" id="shoppingSection">
                <div class="shop-header">
                    <h3>Shopping List</h3>
                    <div class="shop-actions">
                        <button type="button" onclick="refreshFromMeals()">Refresh from meals</button>
                        <button type="button" onclick="window.print()">Print</button>
                        <button type="button" onclick="shareShoppingList()">Share</button>
                    </div>
                </div>
                <div id="shoppingList"></div>
                <div class="shop-add">
                    <select id="whoSelect" onchange="setWho(this.value)" style="padding: 10px 8px; border-radius: 6px; border: 1px solid #e0dcd7; font-size: 14px; background: white;">
                        <option value="">Who am I?</option>
                        <option value="Cait">Cait</option>
                        <option value="Russel">Russel</option>
                    </select>
                    <input type="text" id="customItemInput" placeholder="Add milk, bread, bin bags…" onkeydown="if(event.key==='Enter'){addCustomItem();}">
                    <button type="button" onclick="addCustomItem()">Add</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Recipe Modal -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeRecipeModal()">×</button>
            <h2 class="modal-title" id="modalTitle"></h2>
            <div class="modal-meta" id="modalMeta"></div>

            <div class="modal-section">
                <h3>Servings</h3>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <label style="font-size: 13px; color: #8a9aaa;">Serves:</label>
                    <select id="modalServings" onchange="updateModalIngredients()" style="padding: 8px 10px; border-radius: 6px; border: 1px solid #e0dcd7; font-size: 13px; background: white; color: #1a2633; min-width: 100px;">
                        <option value="2">2 people</option>
                        <option value="3" selected>3 people</option>
                        <option value="4">4 people</option>
                    </select>
                </div>
            </div>

            <div class="modal-section">
                <h3>Ingredients</h3>
                <ul id="modalIngredients" style="list-style: none; padding: 0;"></ul>
            </div>

            <div class="modal-section" id="pantrySection" style="display: none;">
                <h3>Pantry Items</h3>
                <p id="modalPantry"></p>
            </div>

            <div class="modal-section" id="instructionsSection" style="display: none;">
                <h3>Instructions</h3>
                <p id="modalInstructions"></p>
            </div>

            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 20px;">
                <input type="checkbox" id="modalCheckbox" onchange="updateShortlistFromModal()">
                <span style="font-size: 13px; color: #7a9b7f; font-weight: 500;">Add to shortlist</span>
            </label>
        </div>
    </div>

    <script>
        // Recipe data from Notion with detailed ingredients, instructions and serving sizes
        let recipes = []; // Filled from Notion when the page loads

        const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        let shortlist = [];
        let assignments = {};
        let selectedCategory = '';
        let selectedProtein = '';
        let selectedTime = '';

        // Filter options are rebuilt whenever the recipe list changes (after loading from Notion)
        let categories = [];
        let proteins = [];
        function rebuildFilterOptions() {
            categories = [...new Set(recipes.map(r => r.category))].sort();
            proteins = [...new Set(recipes.map(r => r.protein))].sort();
        }

        // Each recipe's ingredients as a list, in the order they are written in Notion.
        // The fallback list in the code stores them as one comma-separated string.
        function normaliseRecipe(recipe) {
            if (!recipe.ingredientList) {
                recipe.ingredientList = (recipe.ingredients || '').split(',').map(s => s.trim()).filter(Boolean);
            }
            if (!recipe.pantryList) {
                recipe.pantryList = (recipe.pantry || '').split('\n').map(s => s.trim()).filter(Boolean);
            }
            return recipe;
        }

        // Loads recipes from Notion. If that fails, the built-in list stays in use.
        async function loadRecipesFromNotion() {
            try {
                const res = await fetch('/api/recipes');
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Could not load recipes');
                if (!Array.isArray(data) || data.length === 0) throw new Error('No recipes returned');
                recipes = data.map(normaliseRecipe);
                return true;
            } catch (e) {
                console.warn('Could not load recipes from Notion:', e.message);
                return false;
            }
        }

        function getProteinIcon(protein) {
            const icons = {
                'Chicken': '🍗',
                'Fish': '🐟',
                'Meat': '🥩',
                'Vegetarian': '🥗'
            };
            return icons[protein] || '🥗';
        }

        // Map detailed proteins from Notion to simplified app categories
        function normalizeProtein(notionProtein) {
            const proteinMap = {
                'Chicken': 'Chicken',
                'Fish': 'Fish',
                'Beef': 'Meat',
                'Pork': 'Meat',
                'Lamb': 'Meat',
                'Halloumi': 'Vegetarian',
                'Paneer': 'Vegetarian',
                'Tofu/Tempeh': 'Vegetarian',
                'Eggs': 'Vegetarian',
                'Beans/Lentils': 'Vegetarian',
                'Vegetarian': 'Vegetarian',
                'None': 'Vegetarian'
            };
            return proteinMap[notionProtein] || 'Vegetarian';
        }

        function getTimeMinutes(timeStr) {
            return parseInt(timeStr);
        }

        function matchesTimeFilter(recipeTime) {
            if (!selectedTime) return true;
            const mins = getTimeMinutes(recipeTime);
            if (selectedTime === 'quick') return mins < 20;
            if (selectedTime === 'medium') return mins >= 20 && mins <= 30;
            if (selectedTime === 'long') return mins > 30;
            return true;
        }

        // Initialize
        async function init() {
            loadFromStorage();
            recipes = recipes.map(normaliseRecipe);
            const fromNotion = await loadRecipesFromNotion();
            if (!fromNotion) {
                document.getElementById('recipes').insertAdjacentHTML('afterbegin',
                    '<div class="empty-state">Couldn\'t load recipes from Notion. Check the connection in Notion, then refresh the page.</div>');
            }
            rebuildFilterOptions();
            renderFilterDropdowns();
            renderRecipes();
            setupTabs();
            document.getElementById('whoSelect').value = getWho();
            await loadPlan();
            await loadWhereList();
            loadShoppingRows();
            // Pick up changes made on the other phone
            setInterval(() => { loadPlan(); loadShoppingRows(); }, 30000);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) { loadPlan(); loadShoppingRows(); }
            });
        }

        function renderFilterDropdowns() {
            const categorySelect = document.getElementById('categoryFilter');
            categorySelect.innerHTML = '<option value="">All Categories</option>' +
                categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
            categorySelect.value = selectedCategory;
            categorySelect.addEventListener('change', (e) => {
                selectedCategory = e.target.value;
                renderRecipes();
            });

            // Render protein icon buttons
            const proteinContainer = document.getElementById('proteinFilters');
            proteinContainer.innerHTML = proteins.map(prot => `
                <button class="protein-btn${selectedProtein === prot ? ' active' : ''}"
                    data-protein="${prot}"
                    title="${prot}">
                    ${getProteinIcon(prot)}
                </button>
            `).join('');

            document.querySelectorAll('[data-protein]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const prot = e.currentTarget.dataset.protein;
                    selectedProtein = selectedProtein === prot ? '' : prot;
                    renderFilterDropdowns();
                    renderRecipes();
                });
            });

            const timeSelect = document.getElementById('timeFilter');
            timeSelect.value = selectedTime;
            timeSelect.addEventListener('change', (e) => {
                selectedTime = e.target.value;
                renderRecipes();
            });
        }

        function setupTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

                    e.target.classList.add('active');
                    document.getElementById(e.target.dataset.tab).classList.add('active');

                    if (e.target.dataset.tab === 'shortlist') renderShortlist();
                    if (e.target.dataset.tab === 'week') renderWeek();
                });
            });
        }

        function renderRecipes() {
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            let filtered = recipes.filter(r => {
                const matchesSearch = r.name.toLowerCase().includes(searchTerm);
                const matchesCategory = !selectedCategory || r.category === selectedCategory;
                const matchesProtein = !selectedProtein || r.protein === selectedProtein;
                const matchesTime = matchesTimeFilter(r.time);
                return matchesSearch && matchesCategory && matchesProtein && matchesTime;
            });

            // Sort by protein (in order), then alphabetically by name
            const proteinOrder = ['Chicken', 'Fish', 'Meat', 'Vegetarian'];
            filtered.sort((a, b) => {
                const proteinAIndex = proteinOrder.indexOf(a.protein);
                const proteinBIndex = proteinOrder.indexOf(b.protein);
                if (proteinAIndex !== proteinBIndex) {
                    return proteinAIndex - proteinBIndex;
                }
                return a.name.localeCompare(b.name);
            });

            const container = document.getElementById('recipesList');
            let html = '';
            let currentProtein = '';

            filtered.forEach((recipe, idx) => {
                // Add protein header when protein changes
                if (recipe.protein !== currentProtein) {
                    if (currentProtein !== '') html += '</div>';
                    currentProtein = recipe.protein;
                    const icon = getProteinIcon(recipe.protein);
                    html += `<div style="margin-top: 20px;"><h3 style="font-size: 13px; color: #8a9aaa; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; font-weight: 600;">${icon} ${recipe.protein}</h3>`;
                }

                html += `
                    <div class="recipe-item" onclick="openRecipeModal('${recipe.name}')">
                        <div class="recipe-item-header">
                            <div class="recipe-item-title">
                                <h4>${recipe.name}</h4>
                            </div>
                        </div>
                        <div class="recipe-badges">
                            <span class="badge">${recipe.category}</span>
                            <span class="badge">⏱ ${recipe.time}</span>
                        </div>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 4px;" onclick="event.stopPropagation();">
                            <input type="checkbox" class="recipe-checkbox" data-name="${recipe.name}" ${shortlist.includes(recipe.name) ? 'checked' : ''}>
                            <span style="font-size: 13px; color: #7a9b7f; font-weight: 500;">Add to shortlist</span>
                        </label>
                    </div>
                `;
            });

            if (currentProtein !== '') html += '</div>';
            container.innerHTML = html;

            document.querySelectorAll('.recipe-checkbox').forEach(cb => {
                cb.addEventListener('change', function(e) {
                    updateShortlist(e.target);
                });
            });

            document.getElementById('searchInput')?.addEventListener('input', renderRecipes);
        }

        function parseIngredient(ingredient) {
            // Parse "quantity unit item" format
            // Examples: "400g chicken", "3 eggs", "100ml yoghurt"
            const match = ingredient.trim().match(/^([\d.]+)\s*(\w+)?\s+(.+)$/);
            if (!match) {
                return { quantity: null, unit: '', item: ingredient.trim() };
            }
            return {
                quantity: parseFloat(match[1]),
                unit: match[2] || '',
                item: match[3]
            };
        }

        function formatQuantity(quantity) {
            if (quantity === null) return '';
            // Round to 1 decimal place for cleaner display
            const rounded = Math.round(quantity * 10) / 10;
            return rounded % 1 === 0 ? rounded.toString() : rounded.toString();
        }

        function scaleIngredient(ingredient, factor) {
            const parsed = parseIngredient(ingredient);
            if (parsed.quantity === null) {
                return ingredient; // Can't scale items without quantities
            }
            const scaledQuantity = parsed.quantity * factor;
            const formattedQty = formatQuantity(scaledQuantity);
            return `${formattedQty}${parsed.unit ? ' ' + parsed.unit : ''} ${parsed.item}`;
        }

        function updateModalIngredients() {
            const recipeName = document.getElementById('modalTitle').textContent;
            const recipe = recipes.find(r => r.name === recipeName);
            if (!recipe) return;

            const servings = parseInt(document.getElementById('modalServings').value);
            const factor = servings / recipe.defaultServings;

            const ingredientsList = document.getElementById('modalIngredients');
            const ingredients = recipe.ingredientList || recipe.ingredients.split(',');

            ingredientsList.innerHTML = ingredients.map(ing => {
                const scaled = scaleIngredient(ing, factor);
                return `<li style="padding: 6px 0; font-size: 14px; color: #1a2633; line-height: 1.5;">• ${scaled}</li>`;
            }).join('');
        }

        function openRecipeModal(recipeName) {
            const recipe = recipes.find(r => r.name === recipeName);
            if (!recipe) return;

            document.getElementById('modalTitle').textContent = recipe.name;
            document.getElementById('modalMeta').innerHTML = `
                <span class="modal-badge">${recipe.protein}</span>
                <span class="modal-badge">${recipe.category}</span>
                <span class="modal-badge">⏱ ${recipe.time}</span>
            `;

            // Make sure the servings dropdown offers the recipe's base size (Notion can say 6, for example)
            const servingsSelect = document.getElementById('modalServings');
            const base = String(recipe.defaultServings);
            if (![...servingsSelect.options].some(o => o.value === base)) {
                const opt = document.createElement('option');
                opt.value = base;
                opt.textContent = `${base} people`;
                servingsSelect.appendChild(opt);
            }

            // Set default servings
            servingsSelect.value = base;

            // Display ingredients scaled to default servings
            updateModalIngredients();

            // Show instructions
            if (recipe.instructions) {
                document.getElementById('modalInstructions').innerHTML = recipe.instructions.split('\n').map(line =>
                    `<li style="padding: 6px 0; font-size: 14px; color: #1a2633; line-height: 1.6;">${line}</li>`
                ).join('');
                document.getElementById('instructionsSection').style.display = 'block';
            } else {
                document.getElementById('instructionsSection').style.display = 'none';
            }

            // Pantry items: shown as a list, in the order written in Notion
            const pantry = recipe.pantryList || [];
            if (pantry.length) {
                document.getElementById('modalPantry').innerHTML = `<ul style="list-style: none; padding: 0;">${pantry.map(item =>
                    `<li style="padding: 4px 0; font-size: 14px; color: #1a2633;">• ${escapeHtml(item)}</li>`
                ).join('')}</ul>`;
                document.getElementById('pantrySection').style.display = 'block';
            } else {
                document.getElementById('pantrySection').style.display = 'none';
            }

            document.getElementById('modalCheckbox').checked = shortlist.includes(recipe.name);

            document.getElementById('recipeModal').classList.add('active');
        }

        function closeRecipeModal() {
            document.getElementById('recipeModal').classList.remove('active');
        }

        function updateShortlistFromModal() {
            const recipeName = document.getElementById('modalTitle').textContent;
            const isChecked = document.getElementById('modalCheckbox').checked;
            const checkbox = { dataset: { name: recipeName }, checked: isChecked };

            updateShortlist(checkbox);
            renderRecipes();
        }

        // Close modal when clicking outside
        document.addEventListener('click', function(event) {
            const modal = document.getElementById('recipeModal');
            if (event.target === modal) {
                closeRecipeModal();
            }
        });

        function updateShortlist(checkbox) {
            const recipeName = checkbox.dataset.name;
            if (checkbox.checked) {
                if (!shortlist.includes(recipeName)) {
                    shortlist.push(recipeName);
                }
            } else {
                shortlist = shortlist.filter(m => m !== recipeName);
                delete assignments[recipeName];
            }
            saveToStorage();
            savePlanMeal(recipeName);
        }

        function renderShortlist() {
            const container = document.getElementById('shortlistContainer');

            if (shortlist.length === 0) {
                container.innerHTML = '<div class="empty-state">No recipes ticked yet. Go to Recipes tab to tick some.</div>';
                return;
            }

            container.innerHTML = shortlist.map(meal => {
                const info = assignments[meal];
                const day = info ? info.day : '';
                const cook = info ? (info.cook || 'Russel') : 'Russel';
                const selectStyle = 'flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #e0dcd7; font-size: 14px; background: white; color: #1a2633;';
                return `
                <div class="shortlist-item">
                    <h4>${meal}</h4>
                    <div style="display: flex; gap: 8px; margin-top: 6px;">
                        <select data-meal="${meal}" onchange="updateAssignment(this)" style="${selectStyle}">
                            <option value="">Not assigned</option>
                            ${days.map(d => `<option value="${d}" ${day === d ? 'selected' : ''}>${d}</option>`).join('')}
                        </select>
                        <select data-meal="${meal}" onchange="updateCook(this)" style="${selectStyle}" ${day ? '' : 'disabled'}>
                            <option value="Russel" ${cook === 'Russel' ? 'selected' : ''}>Russel cooks</option>
                            <option value="Caitlin" ${cook === 'Caitlin' ? 'selected' : ''}>Caitlin cooks</option>
                        </select>
                    </div>
                </div>`;
            }).join('');
        }

        function updateAssignment(select) {
            const meal = select.dataset.meal;
            if (select.value) {
                // Store meal with day and default cook (Russel)
                assignments[meal] = { day: select.value, cook: 'Russel' };
            } else {
                delete assignments[meal];
            }
            saveToStorage();
            savePlanMeal(meal);
            renderShortlist();
        }

        function updateCook(select) {
            const meal = select.dataset.meal;
            const cook = select.value;
            if (assignments[meal]) {
                if (typeof assignments[meal] === 'string') {
                    // Migrate legacy format
                    assignments[meal] = { day: assignments[meal], cook: cook };
                } else {
                    assignments[meal].cook = cook;
                }
                saveToStorage();
                savePlanMeal(meal);
            }
        }

        // The Shopping List tab
        function renderWeek() {
            renderShoppingList();
        }

        // ---- Shared shopping list (stored in Notion via /api/shopping) ----
        let shoppingRows = [];

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function renderShoppingList() {
            loadShoppingRows();
        }

        async function loadShoppingRows() {
            const box = document.getElementById('shoppingList');
            try {
                const res = await fetch('/api/shopping');
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Could not load the list');
                shoppingRows = data;
                drawShoppingList();
            } catch (e) {
                box.innerHTML = `<p class="empty-state">Couldn't load the shared list. ${escapeHtml(e.message)}</p>`;
            }
        }

        // Shop sections, in the order you walk round Lidl
        const SECTION_ORDER = ['Bakery', 'Fruit & veg', 'Meat & fish', 'Dairy & eggs', 'Dry food', 'Frozen', 'Household', 'Other'];
        let whereList = [];

        async function loadWhereList() {
            try {
                const res = await fetch('/api/where');
                if (res.ok) whereList = await res.json();
            } catch (e) { /* keep the last list we had */ }
        }

        // Finds the Where to Buy row whose name appears in the ingredient, e.g. "spinach" in "80g baby spinach"
        function findWhere(text) {
            const lower = String(text).toLowerCase();
            let best = null;
            whereList.forEach(w => {
                const key = w.item.toLowerCase();
                if (key && lower.includes(key) && (!best || key.length > best.item.toLowerCase().length)) best = w;
            });
            return best;
        }

        // Store and section for a new item. Anything not in Where to Buy defaults to Aldi/Lidl, section Other
        function shopFields(item, recipe = '') {
            const w = findWhere(item);
            return {
                item,
                recipe,
                store: w && w.store ? w.store : 'Aldi/Lidl',
                section: w && w.section ? w.section : 'Other',
            };
        }

        function sectionRank(section) {
            const i = SECTION_ORDER.indexOf(section || 'Other');
            return i === -1 ? SECTION_ORDER.length : i;
        }

        function drawShoppingList() {
            const box = document.getElementById('shoppingList');
            if (!shoppingRows.length) {
                box.innerHTML = '<p class="empty-state">Nothing on the list yet. Add items below, or refresh from this week\'s meals.</p>';
                return;
            }
            const groups = {};
            shoppingRows.forEach(r => {
                const key = r.recipe || 'Added items';
                (groups[key] = groups[key] || []).push(r);
            });
            const names = Object.keys(groups).sort((a, b) => {
                if (a === 'Added items') return 1;
                if (b === 'Added items') return -1;
                return a.localeCompare(b);
            });

            const itemList = rows => `
                <ul class="shop-list">
                    ${rows.map(r => `
                        <li class="${r.ticked ? 'ticked' : ''}">
                            <input type="checkbox" ${r.ticked ? 'checked' : ''} onchange="toggleShopItem('${r.id}', this.checked)">
                            <span>${escapeHtml(r.item)}</span>
                            <span class="shop-tag">${escapeHtml(r.store || 'Aldi/Lidl')}</span>
                            <button type="button" class="shop-del" onclick="removeShopItem('${r.id}')" aria-label="Remove">×</button>
                        </li>`).join('')}
                </ul>`;

            box.innerHTML = names.map(name => {
                const rows = groups[name].slice().sort((a, b) =>
                    sectionRank(a.section) - sectionRank(b.section) || a.item.localeCompare(b.item));
                const main = rows.filter(r => r.store !== 'Big shop');
                const big = rows.filter(r => r.store === 'Big shop');
                return `
                <div class="shop-group">
                    <h4>${escapeHtml(name)}</h4>
                    ${main.length ? `<div class="shop-block-label">Aldi / Lidl</div>${itemList(main)}` : ''}
                    ${big.length ? `<div class="shop-block-label">Big shop</div>${itemList(big)}` : ''}
                </div>`;
            }).join('');
        }

        async function toggleShopItem(id, ticked) {
            const row = shoppingRows.find(r => r.id === id);
            if (row) row.ticked = ticked;
            drawShoppingList();
            try {
                const res = await fetch('/api/shopping', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, ticked }),
                });
                if (!res.ok) throw new Error((await res.json()).error);
            } catch (e) {
                alert('Could not save that tick: ' + e.message);
                loadShoppingRows();
            }
        }

        async function removeShopItem(id) {
            shoppingRows = shoppingRows.filter(r => r.id !== id);
            drawShoppingList();
            try {
                const res = await fetch('/api/shopping', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id }),
                });
                if (!res.ok) throw new Error((await res.json()).error);
            } catch (e) {
                alert('Could not remove that item: ' + e.message);
                loadShoppingRows();
            }
        }

        async function addCustomItem() {
            const input = document.getElementById('customItemInput');
            const item = input.value.trim();
            if (!item) return;
            input.value = '';
            try {
                const res = await fetch('/api/shopping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...shopFields(item), addedBy: getWho() }),
                });
                if (!res.ok) throw new Error((await res.json()).error);
                loadShoppingRows();
            } catch (e) {
                alert('Could not add that item: ' + e.message);
                input.value = item;
            }
        }

        // Adds ingredients for this week's meals that aren't on the list yet,
        // and removes ingredients from meals that are no longer assigned.
        async function refreshFromMeals() {
            const assignedMeals = Object.keys(assignments).filter(m => {
                const info = assignments[m];
                return typeof info === 'string' || (info && info.day);
            });

            const wanted = [];
            assignedMeals.forEach(mealName => {
                const recipe = recipes.find(r => r.name === mealName);
                if (!recipe) return;
                (recipe.ingredientList || recipe.ingredients.split(',').map(s => s.trim()).filter(Boolean))
                    .forEach(item => wanted.push({ recipe: mealName, item }));
            });

            await loadWhereList();
            const exists = new Set(shoppingRows.map(r => r.recipe + '|' + r.item));
            const toAdd = wanted.filter(w => !exists.has(w.recipe + '|' + w.item));
            const keep = new Set(wanted.map(w => w.recipe + '|' + w.item));
            const toRemove = shoppingRows.filter(r => r.recipe && !keep.has(r.recipe + '|' + r.item));

            const box = document.getElementById('shoppingList');
            box.insertAdjacentHTML('afterbegin', '<p class="empty-state" id="shopSyncing">Updating list…</p>');

            try {
                // Notion allows about 3 requests a second, so send in small batches.
                for (let i = 0; i < toAdd.length; i += 3) {
                    await Promise.all(toAdd.slice(i, i + 3).map(w => fetch('/api/shopping', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(shopFields(w.item, w.recipe)),
                    })));
                }
                for (let i = 0; i < toRemove.length; i += 3) {
                    await Promise.all(toRemove.slice(i, i + 3).map(r => fetch('/api/shopping', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: r.id }),
                    })));
                }
            } catch (e) {
                alert('Some items could not be updated: ' + e.message);
            }
            await loadShoppingRows();
        }

        async function shareShoppingList() {
            const lines = [];
            const groups = {};
            shoppingRows.filter(r => !r.ticked).forEach(r => {
                const key = r.recipe || 'Custom items';
                (groups[key] = groups[key] || []).push(r.item);
            });
            Object.keys(groups).forEach(name => {
                lines.push(name);
                groups[name].forEach(item => lines.push('  - ' + item));
                lines.push('');
            });
            const text = lines.join('\n').trim() || 'Shopping list is empty';
            if (navigator.share) {
                try { await navigator.share({ title: 'Shopping list', text }); } catch (e) { /* cancelled */ }
            } else {
                try {
                    await navigator.clipboard.writeText(text);
                    alert('Shopping list copied to clipboard');
                } catch (e) {
                    alert(text);
                }
            }
        }

        // ---- Shared shortlist and week plan (stored in Notion via /api/plan) ----
        function getWho() {
            try { return localStorage.getItem('meal-who') || ''; } catch (e) { return ''; }
        }

        function setWho(name) {
            try { localStorage.setItem('meal-who', name); } catch (e) { /* ignore */ }
        }

        async function loadPlan() {
            try {
                const res = await fetch('/api/plan');
                if (!res.ok) throw new Error('plan not loaded');
                const rows = await res.json();
                shortlist = rows.filter(r => r.shortlisted && r.meal).map(r => r.meal);
                assignments = {};
                rows.forEach(r => {
                    if (r.shortlisted && r.day) assignments[r.meal] = { day: r.day, cook: r.cook || 'Russel' };
                });
                saveToStorage();
            } catch (e) {
                // Offline or not set up: keep what is saved on this phone
                return;
            }
            // Redraw the open tab, but not while someone is changing a dropdown
            if (document.activeElement && document.activeElement.tagName === 'SELECT') return;
            renderRecipes();
            if (document.getElementById('shortlist').classList.contains('active')) renderShortlist();
            if (document.getElementById('week').classList.contains('active')) renderWeek();
        }

        async function savePlanMeal(meal) {
            const info = assignments[meal];
            try {
                await fetch('/api/plan', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        meal,
                        shortlisted: shortlist.includes(meal),
                        day: info ? info.day : '',
                        cook: info ? (info.cook || 'Russel') : '',
                        changedBy: getWho(),
                    }),
                });
            } catch (e) {
                // Saved on this phone already; will try again on the next change
            }
        }

        function saveToStorage() {
            localStorage.setItem('meal-shortlist', JSON.stringify(shortlist));
            localStorage.setItem('meal-assignments', JSON.stringify(assignments));
        }

        function loadFromStorage() {
            shortlist = JSON.parse(localStorage.getItem('meal-shortlist') || '[]');
            const saved = JSON.parse(localStorage.getItem('meal-assignments') || '{}');
            assignments = {};
            // Upgrade older saved formats and drop meals that are no longer ticked
            Object.keys(saved).forEach(meal => {
                if (!shortlist.includes(meal)) return;
                const info = saved[meal];
                if (typeof info === 'string') {
                    assignments[meal] = { day: info, cook: 'Russel' };
                } else if (info && info.day) {
                    assignments[meal] = { day: info.day, cook: info.cook || 'Russel' };
                }
            });
            saveToStorage();
        }

        init();
    </script>
</body>
</html>
